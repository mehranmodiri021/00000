name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Build Android Release AAB & Debug APK
    runs-on: ubuntu-latest

    env:
      CREATORFLOW_KEYSTORE_FILE: ${{ runner.temp }}/creatorflow-release.keystore
      CREATORFLOW_KEYSTORE_PASSWORD: ${{ secrets.CREATORFLOW_KEYSTORE_PASSWORD }}
      CREATORFLOW_KEY_ALIAS: ${{ secrets.CREATORFLOW_KEY_ALIAS }}
      CREATORFLOW_KEY_PASSWORD: ${{ secrets.CREATORFLOW_KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies and Bundle Android Assets
        run: |
          npm install
          npm run build

          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/*

          cp -r dist/* android/app/src/main/assets/

          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$ANDROID_HOME/licenses/android-sdk-license"

          echo "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"

          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Prepare Gradle Wrapper
        run: |
          cd android

          mkdir -p gradle/wrapper

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading official gradle-wrapper.jar..."

            curl -fsSL \
              -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          fi

          chmod +x gradlew

      - name: Prepare CreatorFlow Release Keystore
        env:
          CREATORFLOW_KEYSTORE_BASE64: ${{ secrets.CREATORFLOW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CREATORFLOW_KEYSTORE_BASE64" ]; then
            echo "ERROR: CREATORFLOW_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$CREATORFLOW_KEYSTORE_BASE64" \
            | base64 --decode > "$CREATORFLOW_KEYSTORE_FILE"

          if [ ! -s "$CREATORFLOW_KEYSTORE_FILE" ]; then
            echo "ERROR: Release keystore was not created."
            exit 1
          fi

          chmod 600 "$CREATORFLOW_KEYSTORE_FILE"

          echo "CreatorFlow release keystore prepared successfully."

      - name: Validate CreatorFlow Release Signing Configuration
        run: |
          if [ -z "$CREATORFLOW_KEYSTORE_FILE" ]; then
            echo "ERROR: CREATORFLOW_KEYSTORE_FILE is missing."
            exit 1
          fi

          if [ ! -f "$CREATORFLOW_KEYSTORE_FILE" ]; then
            echo "ERROR: CreatorFlow release keystore file does not exist."
            exit 1
          fi

          if [ -z "$CREATORFLOW_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: CREATORFLOW_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$CREATORFLOW_KEY_ALIAS" ]; then
            echo "ERROR: CREATORFLOW_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$CREATORFLOW_KEY_PASSWORD" ]; then
            echo "ERROR: CREATORFLOW_KEY_PASSWORD secret is missing."
            exit 1
          fi

          keytool -list \
            -keystore "$CREATORFLOW_KEYSTORE_FILE" \
            -storepass "$CREATORFLOW_KEYSTORE_PASSWORD" \
            -alias "$CREATORFLOW_KEY_ALIAS" \
            >/dev/null

          echo "CreatorFlow release signing configuration validated successfully."

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Android Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Verify Release AAB Signature
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          echo "Release AAB:"
          ls -lh "$AAB_PATH"

          EXPECTED_SHA256="$(
            keytool -list -v \
              -keystore "$CREATORFLOW_KEYSTORE_FILE" \
              -storepass "$CREATORFLOW_KEYSTORE_PASSWORD" \
              -alias "$CREATORFLOW_KEY_ALIAS" |
              awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          ACTUAL_SHA256="$(
            keytool -printcert -jarfile "$AAB_PATH" |
              awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          echo "Expected signing certificate SHA-256: $EXPECTED_SHA256"
          echo "AAB signing certificate SHA-256:      $ACTUAL_SHA256"

          if [ -z "$EXPECTED_SHA256" ] || [ -z "$ACTUAL_SHA256" ]; then
            echo "ERROR: Could not determine AAB signing certificate."
            exit 1
          fi

          if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "ERROR: AAB is NOT signed with the CreatorFlow release keystore."
            exit 1
          fi

          echo "SUCCESS: AAB is signed with the CreatorFlow release certificate."

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatorflow-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: creatorflow-ai-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
